name: Sync PyPI Stats

on:
    schedule:
        - cron: "0 6 * * *" # Daily at 6 AM UTC
    workflow_dispatch:

jobs:
    sync:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: pip install google-cloud-bigquery pandas db-dtypes beautifulsoup4 requests

            - name: Write GCP credentials
              run: |
                  echo '${{ secrets.GCP_SA_KEY }}' > /tmp/gcp-key.json
                  echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json" >> $GITHUB_ENV

            - name: Sync PyPI stats
              run: python scripts/sync_stats.py

            - name: Clean up credentials
              if: always()
              run: rm -f /tmp/gcp-key.json

            - name: Commit and push
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add static/data/
                  git diff --quiet && git diff --staged --quiet || git commit -m "Update PyPI stats $(date +%Y-%m-%d)"
                  git push
