{{ define "main" }}
<section class="section">
  <div class="container container-narrow">
    <header class="mb-12 reveal text-center">
      <h1 class="page-title">{{ .Title }}</h1>
      <p class="page-subtitle">{{ .Params.description }}</p>
    </header>

    {{ if .Content }}
    <div class="prose reveal mb-12 text-center">
      {{ .Content }}
    </div>
    {{ end }}

    <!-- Direct Email -->
    <div class="reveal text-center mb-16">
      <p class="text-secondary">Prefer email? Reach me directly at</p>
      <a href="mailto:{{ .Site.Params.email }}" class="email-link">{{ .Site.Params.email }}</a>
    </div>

    <!-- Social Links -->
    <div class="reveal mb-12">
      <h2 class="text-center mb-8">Find me online</h2>
      <div class="flex flex-wrap justify-center gap-4">
        <a href="https://github.com/{{ .Site.Params.github }}" class="btn btn-outline" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
          GitHub
        </a>
        <a href="https://github.com/{{ .Site.Params.githubOrg }}" class="btn btn-outline" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
          TechBend Org
        </a>
        <a href="https://pypi.org/user/{{ .Site.Params.pypiUser }}/" class="btn btn-outline" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          PyPI
        </a>
        <a href="{{ .Site.Params.blogLink }}" class="btn btn-outline" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          Blog
        </a>
      </div>
    </div>

    <!-- Cal.com Embed -->
    <div class="reveal mb-12">
      <h2 class="text-center mb-8">Book a time</h2>
      <div id="cal-embed" class="cal-embed"></div>
    </div>

    <!-- Form -->
    {{ if .Site.Params.formspreeId }}
    <div class="reveal card spotlight-card max-w-2xl mx-auto">
      <h2 class="mb-6 text-center">Send a Message</h2>
      <form action="https://formspree.io/f/{{ .Site.Params.formspreeId }}" method="POST" class="contact-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" class="input" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" class="input" required />
        </div>
        <div class="form-group">
          <label for="subject">Subject</label>
          <select id="subject" name="subject" class="select" aria-label="Message subject">
            <option value="consulting">Consulting / Project</option>
            <option value="collaboration">Collaboration</option>
            <option value="opensource">Open Source</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" class="input" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary w-full">Send Message</button>
      </form>
    </div>
    {{ end }}
  </div>
</section>

<script>
  (function (C, A, L) {
    let p = function (a, ar) { a.q.push(ar); };
    let d = C.document;
    C.Cal = C.Cal || function () {

        cal.ns = {};
        cal.q = cal.q || [];
        d.head.appendChild(d.createElement("script")).src = A;
        cal.loaded = true;
      }
      if (ar[0] === L) {
        const api = function () { p(api, arguments); };
        const namespace = ar[1];
        api.q = api.q || [];
        typeof namespace === "string" ? (cal.ns[namespace] = api) && p(api, ar) : p(cal, ar);
        return;
      }
      p(cal, ar);
    };
  })(window, "https://app.cal.com/embed/embed.js", "init");
  Cal("init", { origin: "https://cal.com" });
  Cal("inline", { elementOrSelector: "#cal-embed", calLink: "{{ .Site.Params.sections.booking.calLink }}", layout: "month_view" });
</script>
{{ end }}
