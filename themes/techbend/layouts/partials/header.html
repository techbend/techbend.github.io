<header class="site-nav" id="siteNav">
  <div class="container">
    <a href="/" class="nav-logo">
      <span>⚡</span>
      <span>TechBend</span>
    </a>

    <nav class="nav-links" id="navLinks">
      {{ range .Site.Menus.main }}
      {{ if hasPrefix .URL "http" }}
      <a href="{{ .URL }}" target="_blank" rel="noopener" class="external">
        {{ .Name }}
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </a>
      {{ else }}
      <a href="{{ .URL }}" class="{{ if $.IsMenuCurrent "main" . }}active{{ end }}">{{ .Name }}</a>
      {{ end }}
      {{ end }}
      {{ if .Site.Params.showCalendar }}
      <a href="{{ .Site.Params.calLink }}" target="_blank" rel="noopener" class="nav-cta">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Book Time
      </a>
      {{ end }}
    </nav>

    <div style="display:flex;align-items:center;gap:0.75rem;">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <span id="themeIcon">🌙</span>
      </button>
      <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </div>

  <div class="mobile-nav" id="mobileNav">
    {{ range .Site.Menus.main }}
    {{ if hasPrefix .URL "http" }}
    <a href="{{ .URL }}" target="_blank" rel="noopener">{{ .Name }}</a>
    {{ else }}
    <a href="{{ .URL }}">{{ .Name }}</a>
    {{ end }}
    {{ end }}
  </div>
</header>
