{{ if .Site.Params.showTalks }}
<section class="section" id="talks">
  <div class="container">
    <div class="section-header reveal">
      <h2>{{ .Site.Params.sections.talks.title }}</h2>
    </div>
    <div class="grid grid-2 gap-6 talks-grid stagger-children">
      {{ range .Site.Params.talks }}
      <a href="{{ .href }}" class="card spotlight-card talk-card" target="_blank" rel="noopener">
        <div class="talk-card-meta">
          <span class="role-badge">{{ .role }}</span>
          {{ if .year }}
          <span class="talk-year">{{ .year }}</span>
          {{ end }}
        </div>
        <h3>{{ .title }}</h3>
        <p>{{ .event }}{{ if .place }} · {{ .place }}{{ end }}</p>
      </a>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
