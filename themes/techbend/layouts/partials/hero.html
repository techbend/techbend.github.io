<section class="section hero-section">
  <!-- Aurora Background -->
  <div class="aurora">
    <div class="aurora-blob aurora-blob-1"></div>
    <div class="aurora-blob aurora-blob-2"></div>
    <div class="aurora-blob aurora-blob-3"></div>
    <div class="grid-pattern"></div>
  </div>

  <div class="container hero-content">
    <div class="text-center max-w-2xl mx-auto">
      <!-- Avatar -->
      <div class="reveal avatar-wrapper">
        <div class="avatar-frame">
          <img src="https://www.gravatar.com/avatar/{{ md5 .Site.Params.gravatarEmail }}?s=400&d=identicon" alt="{{ .Site.Params.hero.name }}" class="avatar-img" />
        </div>
        <div class="badge badge-success status-glow">
          <span class="pulse-dot"></span>
          {{ .Site.Params.hero.statusText }}
        </div>
      </div>

      <!-- Name -->
      <h1 class="reveal reveal-delay-1 gradient-text hero-title">
        {{ .Site.Params.hero.name }}
      </h1>

      <!-- Subtitle with Typewriter -->
      <div class="reveal reveal-delay-2 mb-6">
        <p class="hero-subtitle" id="typewriterText">
          {{ .Site.Params.hero.subtitle | default .Site.Params.description }}
        </p>
      </div>

      <!-- Links -->
      <div class="reveal reveal-delay-3 hero-links">
        {{ if .Site.Params.showCalendar }}
        <a href="{{ .Site.Params.calLink }}" class="btn btn-primary" target="_blank" rel="noopener">
          <span>📅</span> Book a Call
        </a>
        {{ end }}
        <a href="https://github.com/{{ .Site.Params.github }}" class="btn btn-outline" target="_blank" rel="noopener">
          <span>💻</span> GitHub
        </a>
        <a href="https://pypi.org/user/{{ .Site.Params.pypiUser }}/" class="btn btn-outline" target="_blank" rel="noopener">
          <span>🐍</span> PyPI
        </a>
        {{ if .Site.Params.showSponsor }}
        <a href="{{ .Site.Params.sponsorLink }}" class="btn btn-outline" target="_blank" rel="noopener">
          <span>❤️</span> Sponsor
        </a>
        {{ end }}
        <a href="{{ .Site.Params.blogLink }}" class="btn btn-outline" target="_blank" rel="noopener">
          <span>📝</span> Blog
        </a>
      </div>

      <!-- Stats -->
      <div class="reveal reveal-delay-4 stagger-children hero-stats" id="heroStats">
        <div class="card card-glass hero-stat-card">
          <div class="skeleton skeleton-stat-value"></div>
          <div class="skeleton skeleton-stat-label"></div>
        </div>
        <div class="card card-glass hero-stat-card">
          <div class="skeleton skeleton-stat-value"></div>
          <div class="skeleton skeleton-stat-label"></div>
        </div>
        <div class="card card-glass hero-stat-card">
          <div class="skeleton skeleton-stat-value"></div>
          <div class="skeleton skeleton-stat-label"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scroll Indicator -->
  <div class="scroll-indicator">
    <span>Scroll</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
  </div>
</section>
