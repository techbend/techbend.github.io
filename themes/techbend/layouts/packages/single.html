{{ define "main" }}
<section class="section">
  <div class="container">
    <header class="mb-12 reveal">
      <h1 class="mb-4">📦 Python Packages</h1>
      <p class="text-lg">All {{ .Site.Params.pypiUser }}'s packages on PyPI with download statistics</p>
    </header>

    <div class="reveal mb-8 packages-controls">
      <div class="packages-search">
        <input type="text" id="packageSearch" placeholder="Search packages..." class="input" />
      </div>
      <div class="packages-sort">
        <select id="packageSort" class="select" aria-label="Sort packages by">
          <option value="downloads">Sort by Downloads</option>
          <option value="name">Sort by Name</option>
          <option value="recent">Sort by Recent</option>
        </select>
      </div>
    </div>

    <div class="reveal mb-4 packages-total" id="packagesTotal">Loading packages...</div>

    <div class="grid grid-3 gap-6 stagger-children" id="packagesAll">
      <div class="card spotlight-card">
        <div class="skeleton skeleton-title"></div>
        <div class="skeleton skeleton-line"></div>
        <div class="skeleton skeleton-line-short"></div>
        <div class="skeleton skeleton-badge"></div>
      </div>
      <div class="card spotlight-card">
        <div class="skeleton skeleton-title"></div>
        <div class="skeleton skeleton-line"></div>
        <div class="skeleton skeleton-line-short"></div>
        <div class="skeleton skeleton-badge"></div>
      </div>
      <div class="card spotlight-card">
        <div class="skeleton skeleton-title"></div>
        <div class="skeleton skeleton-line"></div>
        <div class="skeleton skeleton-line-short"></div>
        <div class="skeleton skeleton-badge"></div>
      </div>
      <div class="card spotlight-card">
        <div class="skeleton skeleton-title"></div>
        <div class="skeleton skeleton-line"></div>
        <div class="skeleton skeleton-line-short"></div>
        <div class="skeleton skeleton-badge"></div>
      </div>
    </div>
  </div>
</section>
{{ end }}
