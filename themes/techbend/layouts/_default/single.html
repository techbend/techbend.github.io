{{ define "main" }}
<article class="section">
  <div class="container container-narrow">
    {{ if .Title }}
    <header class="mb-12 reveal">
      <h1 style="margin-bottom:1rem;">{{ .Title }}</h1>
      {{ if .Params.subtitle }}
      <p style="font-size:1.125rem;">{{ .Params.subtitle }}</p>
      {{ end }}
    </header>
    {{ end }}

    <div class="prose reveal">
      {{ .Content }}
    </div>
  </div>
</article>
{{ end }}
