{{ define "main" }}
<article class="section">
  <div class="container container-narrow">
    {{ if .Title }}
    <header class="mb-12 reveal">
      <h1 class="page-title">{{ .Title }}</h1>
      {{ if .Params.subtitle }}
      <p class="page-subtitle">{{ .Params.subtitle }}</p>
      {{ end }}
    </header>
    {{ end }}

    <div class="prose reveal">
      {{ .Content }}
    </div>
  </div>
</article>
{{ end }}
