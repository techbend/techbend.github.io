{{ define "main" }}
<article class="page-content">
    <div class="container narrow">
        {{ if .Title }}
        <header class="page-header">
            <h1>{{ .Title }}</h1>
            {{ if .Params.subtitle }}
            <p class="subtitle">{{ .Params.subtitle }}</p>
            {{ end }}
        </header>
        {{ end }}

        <div class="content">
            {{ .Content }}
        </div>
    </div>
</article>
{{ end }}
