[project]
name = "techbend-github-io"
version = "0.1.0"
description = "TechBend developer portal data pipeline"
readme = "AGENTS.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "clickhouse-connect>=0.15.1",
    "db-dtypes>=1.5.1",
    "google-cloud-bigquery>=3.41.0",
    "pandas>=2.3.3",
    "requests>=2.33.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
