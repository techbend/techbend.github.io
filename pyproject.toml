[project]
name = "techbend-github-io"
version = "0.1.0"
description = "TechBend developer portal data pipeline"
readme = "AGENTS.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "clickhouse-connect>=0.15.1",
    "db-dtypes>=1.5.1",
    "google-cloud-bigquery>=3.41.0",
    "pandas>=2.3.3",
    "requests>=2.33.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.uv]
# Minimum patched versions for transitive dependencies found by security audits.
constraint-dependencies = [
    "certifi>=2026.10.19",
    "cryptography>=50.0.0",
    "idna>=3.15",
    "pyasn1>=0.6.4",
    "soupsieve>=2.9.0",
    "urllib3>=2.8.0",
]
